spring.application.name=league-track
server.port=8081

# MySQL XAMPP Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/league_track?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Tournament Scoring Configuration (Win: 3, Draw: 1, Loss: 0)
leaguetrack.scoring.win-points=3
leaguetrack.scoring.draw-points=1
leaguetrack.scoring.loss-points=0

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
